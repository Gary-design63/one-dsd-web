name: Import complete PAC production snapshot
on:
  push:
    branches: [deploy/full-pac-production]
    paths: [.github/workflows/import-full-production.yml]
permissions:
  contents: write
jobs:
  import:
    if: "!contains(github.event.head_commit.message, 'Import verified full PAC production')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified source snapshot
        env:
          SOURCE_ARCHIVE: "https://codeload.github.com/alphaequity123-afk/one-dhs-equity-resource/legacy.tar.gz/d5b69d17d18c7d43f84b5fc11da1b94e7b8746a1?token=CGQK7YU5MU6HN5FOTZ54SFTKWK6OU"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pac-source"
          curl --fail --location --retry 2 "$SOURCE_ARCHIVE" -o "$RUNNER_TEMP/pac-source.tar.gz"
          tar -xzf "$RUNNER_TEMP/pac-source.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/pac-source"
      - name: Import entire program and preserve previous hosting workflows as documentation
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch .
          cp -a "$RUNNER_TEMP/pac-source/." .
          if [ -d .github/workflows ]; then
            mkdir -p docs/deployment/source-workflows
            mv .github/workflows/* docs/deployment/source-workflows/
            rmdir .github/workflows
          fi
          git add -A
          git -c user.name="PAC deployment" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Import verified full PAC production snapshot d5b69d1 for Railway"
          git push origin HEAD:deploy/full-pac-production
