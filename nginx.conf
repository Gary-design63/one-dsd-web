server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  root /usr/share/nginx/html;

  index index.html;

  location = / {
    add_header Cache-Control "no-store, must-revalidate" always;
    try_files /index.html =404;
  }
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://esm.sh https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data:; font-src 'self' data:;" always;

  gzip on;
  gzip_types text/html text/css application/javascript application/json;
  gzip_min_length 256;
}
